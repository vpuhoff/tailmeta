name: Test and publish

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailmeta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build --outdir packages
      - name: Check distributions and release version
        run: |
          python -m twine check --strict packages/*
          python ci/check_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: packages/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        signing: ['no', 'yes']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: packages
      - name: Install and test the built wheel in an isolated environment
        env:
          TAILMETA_TEST_SIGNING: ${{ matrix.signing }}
        run: python ci/test_wheel.py

  nuitka:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: packages
      - name: Install onefile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python -m pip install nuitka zstandard ordered-set cryptography
          python -m pip install packages/*.whl
      - name: Build and test a real onefile executable
        run: |
          python -m nuitka --onefile --assume-yes-for-downloads --output-dir=dist examples/nuitka/main.py
          python examples/nuitka/test_onefile.py dist/main.bin

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, nuitka]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tailmeta/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: packages
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/

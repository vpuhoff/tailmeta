name: Test and publish

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailmeta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install --require-hashes --no-deps -r ci/requirements-build.txt
      - name: Build sdist and wheel
        # The backend comes from the hashed lock file instead of an isolated,
        # unpinned download of the requirements in pyproject.toml.
        run: python -m build --no-isolation --outdir packages
      - name: Check distributions and release version
        run: |
          python -m twine check --strict packages/*
          python ci/check_dist.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: packages/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        signing: ['no', 'yes']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: packages
      - name: Install and test the built wheel in an isolated environment
        env:
          TAILMETA_TEST_SIGNING: ${{ matrix.signing }}
        run: python ci/test_wheel.py

  nuitka:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: packages
      # Nuitka keeps its ccache and module cache in ~/.cache/Nuitka. The key is
      # unique per run so every run saves a fresh cache; restore-keys picks up
      # the newest earlier one, and ccache checks each C file on its own.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Nuitka
          key: nuitka-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ github.run_id }}
          restore-keys: |
            nuitka-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-
      - name: Install onefile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache
          python -m pip install nuitka zstandard ordered-set cryptography
          python -m pip install packages/*.whl
      - name: Build and test a real onefile executable
        run: |
          python -m nuitka --onefile --assume-yes-for-downloads --output-dir=dist examples/nuitka/main.py
          python examples/nuitka/test_onefile.py dist/main.bin

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, nuitka]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tailmeta/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: packages
      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packages/
